<h2>Card Details</h2>
@if (error) { <p role="alert">{{error}}</p> }
<form class="card-form">
  <mat-form-field class="form-full-width">
    <mat-label> Blog Name</mat-label>
    <input matInput placeholder="Blog Title" [(ngModel)]="card.name" name="name">
  </mat-form-field>

  <mat-form-field class="form-full-width">
    <mat-label>Content</mat-label>
    <textarea matInput placeholder="Ex. It makes me feel..." [(ngModel)]="card.content" rows="4"
    name="content"></textarea>
  </mat-form-field>

  <mat-form-field class="form-full-width">
    <mat-label>Status</mat-label>
    <mat-select [(ngModel)]="card.status" name="status" [value]="card.status">
      <mat-option value="DRAFT">Draft</mat-option>
      <mat-option value="PUBLISH">Publish</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field class="form-full-width">
    <mat-label>Category</mat-label>
    <mat-select [(ngModel)]="card.categoryId" name="categoryId">
      <mat-option [value]="undefined">None</mat-option>
      @for (cat of categories; track cat) {
        <mat-option [value]="cat.id">{{cat.name}}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field class="form-full-width">
    <mat-label>Author</mat-label>
    <mat-select [(ngModel)]="card.authorId" name="authorId">
      <mat-option [value]="undefined">None</mat-option>
      @for (author of authors; track author.id) {
        <mat-option [value]="author.id">{{author.username}}</mat-option>
      }
    </mat-select>
  </mat-form-field>
    </form>
    <div class="button-row">
      <button mat-raised-button color="primary" (click)="onSave()" [disabled]="saving">Save</button>
      <button mat-raised-button color="primary" (click)="goBack()">Cancel</button>
      <button mat-raised-button color="warn" (click)="onDelete()" [disabled]="!isEdit || saving">Delete</button>
    </div>
